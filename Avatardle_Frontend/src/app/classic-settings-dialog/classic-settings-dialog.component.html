<header class="dialog-header">
    <div class="dialog-heading">
        <h1 mat-dialog-title>{{'classic.settings.title' | translate}}</h1>
    </div>
    <button mat-dialog-close class="dialog-close" type="button"
        [aria-label]="'classic.settings.close' | translate">&times;</button>
</header>

<mat-dialog-content class="dialog-body">
    <section class="series-section" aria-labelledby="series-heading">
        <h2 id="series-heading">{{'classic.settings.series-select' | translate}}</h2>
        <div class="series-options" role="group" aria-labelledby="series-heading" aria-describedby="series-warning">
            @for(item of list; track item.name){
            <label class="series-option" [class.selected]="item.selected" [for]="item.name">
                <img [src]="item.icon" alt="" draggable="false">
                <span>{{item.name | translate}}</span>
                <input type="checkbox" [id]="item.name" [(ngModel)]="item.selected">
            </label>
            }
        </div>
        <p class="progress-warning" id="series-warning">{{'classic.settings.progressWarning' | translate}}</p>
    </section>

    <section class="dialog-section color-section" aria-labelledby="color-heading">
        <h2 id="color-heading">{{'classic.settings.colorblind' | translate}}</h2>
        <select class="modal-button color-mode" aria-labelledby="color-heading" [ngModel]="colorMode()"
            (ngModelChange)="setColor($event)">
            <option value="#bf2c23+#295e11">{{'classic.settings.off' | translate}}</option>
            <option value="#bf2c23+#2f67b1">{{'classic.settings.red+blue' | translate}}</option>
            <option value="#58094f+#295e11">{{'classic.settings.purple+green' | translate}}</option>
            <option value="custom">{{'classic.settings.custom' | translate}}</option>
        </select>

        <div class="color-swatches" [formGroup]="colorForm">
            <label class="color-swatch" for="incorrect-color">
                <span>{{'classic.settings.incorrect' | translate}}</span>
                <input id="incorrect-color" type="color" formControlName="incorrectColor">
            </label>
            <label class="color-swatch" for="correct-color">
                <span>{{'classic.settings.correct' | translate}}</span>
                <input id="correct-color" type="color" formControlName="correctColor">
            </label>
        </div>
    </section>
</mat-dialog-content>

<footer class="settings-footer">
    <button class="modal-button save-button" type="button" (click)="onSave()"
        [disabled]="selectedCount === 0">{{'save' | translate}}</button>
</footer>
