<header class="dialog-header">
    <div class="dialog-heading">
        <h1 mat-dialog-title>{{'commentDialog.title' | translate}}</h1>
    </div>
    <button mat-dialog-close class="dialog-close" type="button" [aria-label]="'commentDialog.close' | translate">&times;</button>
</header>

<mat-dialog-content class="dialog-body comment-content">
    <textarea id="comment-message" maxlength="10000" [placeholder]="'commentDialog.placeholder' | translate"
        [(ngModel)]="message" [attr.aria-label]="'commentDialog.message' | translate"></textarea>
</mat-dialog-content>

<mat-dialog-actions class="comment-actions">
    <button id="comment-button" class="modal-button" type="button" [disabled]="!message.trim()" (click)="onSubmit()">{{'commentDialog.comment' | translate}}</button>
</mat-dialog-actions>
