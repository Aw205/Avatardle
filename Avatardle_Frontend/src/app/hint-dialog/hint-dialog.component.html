<header class="dialog-header">
    <div class="dialog-heading">
        <h1 mat-dialog-title>{{('quoteHints.' + data.kind) | translate}}</h1>
    </div>
    <button mat-dialog-close class="dialog-close" type="button"
        [aria-label]="'quoteHints.close' | translate">&times;</button>
</header>

<mat-dialog-content class="dialog-body">
    @if(data.kind === 'episode'){
    <div class="episode-card">
        @if(episodeCode){
        <span class="episode-code">{{episodeCode}}</span>
        }
        <p class="episode-title">{{episodeTitle}}</p>
    </div>
    } @else {
    <blockquote class="hint-quote">{{data.quote}}</blockquote>
    }
</mat-dialog-content>
