<div class="mode-container">
    <div (click)="setMode('daily')" [class.selected]="mode()=='daily'">
        <span class="material-symbols-outlined">calendar_today</span>Daily
    </div>
    <div (click)="setMode('infinite')" [class.selected]="mode()=='infinite'" style="position: relative;"
        matTooltip="Complete daily to unlock" matTooltipPosition="right" [matTooltipDisabled]="isComplete()">
        <span class="material-symbols-outlined">{{isComplete() ? 'electric_bolt' : 'lock'}}</span>Blitz
    </div>
</div>

@if(mode()==='daily'){
<search-select [options]="episodeData" [mode]="'picture'" [disabled]="isComplete()"
    [displayValue]="isComplete() ? epiNum + ('episodes.' + targetEpisode | translate) : ''"
    (optionSelect)="onEnter($event)"></search-select>

<div
    style="position:relative; width: fit-content; margin:auto; font: 1rem avatar2; color: gray; z-index: 1; margin-top: 1rem;">
    <ngx-digit-flow [value]="(ds.stats$ | async)?.picture_completion ?? 0" [continuous]="true" spinEasing="default"
        style="color:darkgoldenrod;" [duration]="1500" /> {{'odometer' | translate}}
    <button [disabled]="isSurrenderDisabled()" (click)="openDialog('surrender')" class="surrender-button">
        <span class="material-symbols-outlined" [matTooltip]="getSurrenderText()" matTooltipPosition="right"
            [matTooltipDisabled]="isComplete()">flag</span>
    </button>
</div>

<div class="image-container">
    <div class="image-wrapper">
        <img [src]="targetFrame()" alt="A frame from an episode of Avatar: The Last Airbender" [class.df]="addt()"
            width="1440" height="1080" [style.transform]="'scale('+ scaleRatio() + ')'"
            [style.filter]="'grayscale('+ grayscaleRatio() +')'">

    </div>
    <div class="hint-container">
        <button aria-label="Picture Hint" [disabled]="!isEnabled(0)" [matTooltip]="getTooltipText(0)"
            matTooltipPosition="right" (click)="expandImage(prevFrame,'picture.previous')"><img src="images/lotus.svg"
                alt=""></button>
        <button aria-label="Picture Hint" [disabled]="!isEnabled(1)" [matTooltip]="getTooltipText(1)"
            matTooltipPosition="right" (click)="expandImage(nextFrame,'picture.next')"><img src="images/lotus.svg"
                alt=""></button>
    </div>
    <div style="font:1rem Georgia; color: dimgray; text-align: right;">{{scaleRatio()}}&times;</div>
</div>

@for (ans of incorrectAnswers; track ans){
@let name = 'episodes.' + ans | translate;
<div class="incorrect-picture-guess"><span>{{ans.substring(0,7)}}</span>{{name}}</div>
}

}
@else {
<picture-blitz></picture-blitz>
}
