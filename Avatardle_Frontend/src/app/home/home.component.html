<nav>
    @for(mode of modes; track mode.id){
    <a [routerLink]="'/' + mode.id" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg class="mode-artwork" viewBox="0 0 680 248" aria-hidden="true" focusable="false">
            <defs>
                <clipPath [attr.id]="'home-' + mode.id + '-slot'">
                    <circle cx="112" cy="124" r="90" />
                </clipPath>
            </defs>
            <image href="images/paisho_container.svg" width="680" height="248" />
            <g [attr.clip-path]="'url(#home-' + mode.id + '-slot)'">
                <g class="paisho-sprite">
                    <svg x="22" y="34" width="180" height="180" [attr.viewBox]="mode.tileX + ' 0 184 184'" overflow="hidden">
                        <image href="images/paisho_final.svg" width="1300" height="184" />
                    </svg>
                </g>
            </g>
        </svg>
        @if(mode.marker){
        <span class="groove-marker" [class.groove-marker--left]="mode.marker === 'left'"
            [class.groove-marker--right]="mode.marker === 'right'" aria-hidden="true"></span>
        }
        <span class="mode-label">{{('home.' + mode.id) | translate}}</span>
    </a>
    }
</nav>
