<header class="dialog-header">
    <div class="dialog-heading">
        <h1 mat-dialog-title>{{'particleSettings.title' | translate}}</h1>
    </div>
    <button mat-dialog-close class="dialog-close" type="button" [aria-label]="'particleSettings.close' | translate">&times;</button>
</header>

<mat-dialog-content class="dialog-body">
    <label class="effects-toggle" for="enable-particle">
        <span class="effects-title">{{'particleSettings.enable' | translate}}</span>
        <span class="switch-control">
            <input id="enable-particle" type="checkbox" role="switch" [checked]="enableParticles()"
                [attr.aria-label]="'particleSettings.enable' | translate"
                (change)="setEnabled($event)">
            <span class="switch-track" aria-hidden="true"></span>
        </span>
    </label>

    <section class="dialog-section element-section" aria-labelledby="element-heading">
        <h2 id="element-heading">{{'particleSettings.chooseElement' | translate}}</h2>
        <div class="element-wheel">
            @for(element of elements; track element.id){
            <button class="element-choice" type="button" [attr.data-element]="element.id"
                [attr.aria-label]="element.label | translate"
                [class.selected]="selected === element.id" [attr.aria-pressed]="selected === element.id" (click)="selectElement(element.id)">
                <span class="element-content">
                    <img [src]="'images/elements/' + element.id + '.svg'" alt="" aria-hidden="true">
                </span>
            </button>
            }
            <button class="wheel-centre" type="button" (click)="selectElement(cycleElement)"
                [attr.aria-label]="('particleSettings.useToday' | translate) + ': ' + (cycleElementLabel | translate)"
                [title]="'particleSettings.useToday' | translate" aria-describedby="daily-element-caption">
                <svg class="daily-cycle" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M19 8a8 8 0 0 0-13-2L3 9m0-5v5h5m-3 7a8 8 0 0 0 13 2l3-3m0 5v-5h-5" />
                </svg>
            </button>
        </div>
        <p class="daily-element" id="daily-element-caption">
            <span>{{'particleSettings.today' | translate}}</span>
            <span class="daily-element-name">
                <img [src]="'images/elements/' + cycleElement + '.svg'" alt="" aria-hidden="true">
                {{cycleElementLabel | translate}}
            </span>
        </p>
    </section>
</mat-dialog-content>

<footer class="settings-footer">
    <p>{{'particleSettings.applyOnClose' | translate}}</p>
    <button mat-dialog-close class="modal-button done-button" type="button">{{'particleSettings.done' | translate}}</button>
</footer>
